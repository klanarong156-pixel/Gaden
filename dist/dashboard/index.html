<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4faf4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="สวนลุงนะ" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="stylesheet" href="css/app.css" />
  <title>สวนลุงนะ · Smart Farm</title>
</head>
<body>
  <main id="app" class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow">SMART FARM · V7</p><h1>สวนลุงนะ</h1><div id="connection" class="connection offline"><span></span><span>รอข้อมูลจากอุปกรณ์</span></div></div>
      <button id="alertsBtn" class="icon-btn" aria-label="เปิดการแจ้งเตือน">♢<b id="alertBadge" hidden>0</b></button>
    </header>
    <section id="view" class="view" aria-live="polite"></section>
    <nav class="bottom-nav" aria-label="เมนูหลัก">
      <a href="#dashboard" data-route="dashboard">⌂<span>ภาพรวม</span></a>
      <a href="#devices" data-route="devices">◉<span>อุปกรณ์</span></a>
      <a href="#schedule" data-route="schedule">◷<span>ตั้งเวลา</span></a>
      <a href="#account" data-route="account">♙<span>บัญชี</span></a>
      <a href="#settings" data-route="settings">⚙<span>ตั้งค่า</span></a>
    </nav>
  </main>
  <dialog id="confirmDialog"><form method="dialog"><h2 id="dialogTitle">ยืนยันการทำงาน</h2><p id="dialogText"></p><div class="dialog-actions"><button value="cancel" class="btn secondary">ยกเลิก</button><button value="confirm" class="btn danger">ยืนยัน</button></div></form></dialog>
  <script type="module" src="js/app.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../service-worker.js');</script>
</body>
</html>
